[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobhunter"
version = "0.1.0"
description = "Automated internship discovery and application assistant"
requires-python = ">=3.12"
dependencies = [
    # Web & HTTP
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "feedparser>=6.0",        # RSS/Atom parsing
    "playwright>=1.44",       # Browser automation

    # Data & validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",         # Fuzzy string matching for dedup

    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",          # Migrations

    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",

    # Scheduling
    "apscheduler>=3.10",

    # Dashboard
    "streamlit>=1.35",

    # Notifications
    "python-telegram-bot>=21.3",

    # Email (IMAP parsing for job alerts)
    "imapclient>=3.0",
    "mail-parser>=3.15",

    # AI analysis
    "anthropic>=0.28",
    "openai>=1.30",           # Provider-agnostic interface

    # Crypto & security
    "cryptography>=42.0",

    # Logging
    "structlog>=24.2",

    # Utils
    "tenacity>=8.3",          # Retries with backoff
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "click>=8.1",             # CLI
    "rich>=13.7",             # Terminal output
    "jinja2>=3.1",            # Templates for cover letters
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx[test]>=0.27",
    "respx>=0.21",            # Mock httpx requests
]

[project.scripts]
jobhunter = "jobhunter.cli:app"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=jobhunter --cov-report=term-missing"
